<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Video Stream</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    font-family:Inter,sans-serif;
    background:#1f2937;
}
.video-container{
    max-width:900px;
    width:100%;
}
iframe{
    width:100%;
    aspect-ratio:16/9;
    border:0;
}
</style>

</head>

<body class="flex items-center justify-center min-h-screen p-4">

<div class="video-container bg-gray-800 rounded-xl shadow-xl p-6">

<h1 class="text-3xl font-bold text-white mb-3">
Secure Video Stream
</h1>

<p class="text-gray-300 mb-6">
Embedded YouTube Video
</p>

<div class="overflow-hidden rounded-lg border-4 border-indigo-500/40">

<iframe
src="https://www.youtube.com/embed/xvDK4un5hrc"
title="YouTube video player"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>

</div>

</div>

</body>
</html>
